# Documentation site on GitHub Pages, built from docs/ by .github/workflows/docs.yml
site_name: Day-Ahead Price Forecast
site_description: Home Assistant integration, chart card and public API for the 7-day day-ahead electricity price forecast
site_url: https://abroeders.github.io/7day-ahead-price-forecast/

docs_dir: docs
exclude_docs: |
  architecture.md
  design/
  hooks.py
  __pycache__/
hooks:
  - docs/hooks.py

nav:
  - Home: README.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Entities: entities.md
  - Price chart card: card.md
  - FAQ: faq.md
  - Forecast service API: forecast-service.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light theme

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
