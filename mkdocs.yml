# Documentation site on GitHub Pages, built from docs/ by .github/workflows/docs.yml
site_name: Day-Ahead Price Forecast
site_description: Home Assistant integration, chart card and public API for the 7-day day-ahead electricity price forecast
site_url: https://abroeders.github.io/7day-ahead-price-forecast/
repo_url: https://github.com/abroeders/7day-ahead-price-forecast

docs_dir: docs
exclude_docs: |
  architecture.md
  overrides/
  design/
  hooks.py
  __pycache__/
hooks:
  - docs/hooks.py

nav:
  - Home: README.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Entities: entities.md
  - Accuracy: accuracy.md
  - Price chart card: card.md
  - Automations and templates: automations.md
  - FAQ: faq.md

theme:
  name: material
  custom_dir: docs/overrides  # partials/header.html: support button in the top bar
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light theme

extra:
  social:
    - icon: simple/buymeacoffee
      link: https://www.buymeacoffee.com/abroeders
      name: Support the development with a coffee
    - icon: fontawesome/brands/github
      link: https://github.com/abroeders/7day-ahead-price-forecast
      name: Source code on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
